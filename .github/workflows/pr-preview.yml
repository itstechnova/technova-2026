name: PR preview

# Builds every pull request and deploys it to a stable per-PR Netlify URL
# (https://pr-<number>--<site>.netlify.app), then posts/updates one comment on the PR with the link.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN  Netlify personal access token (User settings -> Applications)
#   NETLIFY_SITE_ID     Site/Project ID (Netlify -> Project configuration -> General)
#
# Public build configuration comes from Actions variables; private values use Actions secrets.
# Netlify-protected values cannot be read by the CLI running on GitHub Actions.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same PR cancels the in-flight preview build.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    # Fork PRs don't receive secrets, so skip them rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      CI_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      CI_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CI_RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      CI_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CI_SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
      NETLIFY_CLI: netlify-cli@24
      ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      # Build and deploy in ONE CLI invocation. The Next.js runtime plugin only swaps its static
      # output (CSS/JS under /_next/static) into the publish dir for the duration of the build, so
      # a separate `netlify build` followed by `deploy --no-build` uploads a site with no assets.
      # The build uses netlify.toml (base = client) and the site's deploy-preview env vars.
      - name: Build and deploy to Netlify
        id: deploy
        run: |
          set -euo pipefail
          : "${CI_SUPABASE_URL:?Missing Actions variable NEXT_PUBLIC_SUPABASE_URL}"
          : "${CI_SUPABASE_PUBLISHABLE_KEY:?Missing Actions variable NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          # Apply values inside the build process, after Netlify loads protected placeholders.
          # This temporary context contains variable references only, never secret values.
          cat >> netlify.toml <<'TOML'

          [context.deploy-preview]
            command = 'NEXT_PUBLIC_SUPABASE_URL="$CI_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$CI_SUPABASE_PUBLISHABLE_KEY" RESEND_FROM_EMAIL="$CI_RESEND_FROM_EMAIL" RESEND_API_KEY="$CI_RESEND_API_KEY" SEND_EMAIL_HOOK_SECRET="$CI_SEND_EMAIL_HOOK_SECRET" npm run build'
          TOML
          npx --yes "$NETLIFY_CLI" deploy \
            --context deploy-preview \
            --alias "$ALIAS" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            --json | tee deploy.log
          # Pull the URL out of the JSON even if build output is interleaved with it.
          url=$(grep -o '"deploy_url": *"[^"]*"' deploy.log | tail -1 | sed 's/.*"\(https[^"]*\)"/\1/')
          test -n "$url" || { echo "::error::No deploy_url in Netlify CLI output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const { PREVIEW_URL, HEAD_SHA } = process.env;
            const body = [
              marker,
              '### 🚀 Preview deployed',
              '',
              `**Test it here:** ${PREVIEW_URL}`,
              '',
              `Built from \`${HEAD_SHA.slice(0, 7)}\` · updates on every push to this PR · ` +
                `[build log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
