name: PR preview

# Builds every pull request and deploys it to a stable per-PR Netlify URL
# (https://pr-<number>--<site>.netlify.app), then posts/updates one comment on the PR with the link.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   NETLIFY_AUTH_TOKEN  Netlify personal access token (User settings -> Applications)
#   NETLIFY_SITE_ID     Site/Project ID (Netlify -> Project configuration -> General)
#
# Build-time env vars (Supabase keys, Resend, etc.) are NOT duplicated here: the Netlify CLI pulls
# them from the Netlify site's "Deploy Previews" context.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same PR cancels the in-flight preview build.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    # Fork PRs don't receive secrets, so skip them rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_CLI: netlify-cli@24
      ALIAS: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund

      # Runs the build described in netlify.toml (base = client, Next.js runtime plugin) with the
      # site's deploy-preview environment variables. Kept separate from the deploy so build logs
      # are readable here.
      - name: Build
        run: npx --yes "$NETLIFY_CLI" build --context deploy-preview

      - name: Deploy to Netlify
        id: deploy
        run: |
          npx --yes "$NETLIFY_CLI" deploy --no-build \
            --context deploy-preview \
            --alias "$ALIAS" \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            --json > deploy.json
          url=$(jq -er '.deploy_url' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const { PREVIEW_URL, HEAD_SHA } = process.env;
            const body = [
              marker,
              '### 🚀 Preview deployed',
              '',
              `**Test it here:** ${PREVIEW_URL}`,
              '',
              `Built from \`${HEAD_SHA.slice(0, 7)}\` · updates on every push to this PR · ` +
                `[build log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
